name: Java CI for Feature Branches (Minecraft 1.8 Plugin)

on:
  push:
    branches:
      - 'feature/**'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 8 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '8'

      - name: Ensure dependencies for BuildTools
        run: sudo apt-get update && sudo apt-get install -y git

      - name: Download BuildTools
        run: wget https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar

      - name: Generate Spigot 1.8.8 jar
        run: |
          mkdir buildtools
          mv BuildTools.jar buildtools/
          cd buildtools
          git config --global --add safe.directory "$PWD"
          java -jar BuildTools.jar --rev 1.8.8
          cd ..

      - name: Install Spigot jar in local Maven repo
        run: |
          mvn install:install-file \
            -Dfile=buildtools/spigot-1.8.8.jar \
            -DgroupId=org.spigotmc \
            -DartifactId=spigot \
            -Dversion=1.8.8-R0.1-SNAPSHOT \
            -Dpackaging=jar

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Run tests with Maven
        run: mvn test

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: target/*.jar

      - name: Create Pull Request to master
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          branch: ${{ github.ref_name }}
          title: 'Automatic PR from ${{ github.ref_name }}'
          body: |
            Este PR foi criado automaticamente pelo workflow de CI após o build da branch `${{ github.ref_name }}`.

permissions:
  contents: write
  pull-requests: write